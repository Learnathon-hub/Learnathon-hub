<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot password</title>
    <link rel="stylesheet" href="asset/css/style.css" />
  </head>
  <body>
    <!-- navbar -->
    <header class="header">
      <div class="logo"><a href="index.html">Learnathon</a></div>
      <div class="back">&larr; Back</div>
    </header>
    <!-- End of navbar -->

    <!-- Form container -->
    <main class="forgot-main">
      <div class="forgot-form-container">
        <form action="#">
          <h1>Forgot Password</h1>
          <label for="email">Enter registered email</label>
          <input type="email" placeholder="enter email" />

          <label for="password">Enter new password</label>
          <input type="password" placeholder="new password" />

          <label for="password">Confirm password</label>
          <input type="password" placeholder="confirm password" />

          <button type="submit">Reset</button>

          <p>Remembered password <a href="login.html">Login</a></p>
        </form>
      </div>
    </main>
    <!-- End of form container -->
    <!-- footer -->
    <footer class="footer">&copy;Learnathon2026</footer>
    <!-- End of footer -->
  </body>
</html>
