<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <header class="login-header">
        <a href="index.html" class="login-logo">Learnathon</a>
    </header>
    <a href="index.html" class="back-home">Back to Home</a>
</header>

<main class="login-main">
    <section class="login-card slogin-card">
        <div class="login-heading">
            <h1>Welcome Back!</h1>
            <p>Continue your learning journey with us.</p>
        </div>

        <form action="#" method="post">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input 
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email address" autocomplete="email" 
                 required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input 
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password" autocomplete="current-password" 
                required>
            </div>
            <div class="form-options">
                <label class="checkbox-label">
                    <input 
                    type="checkbox"
                    name="remember">
                    <span>Remember me</span>
                </label>
                    <a href="forget-password.html" class="text-link"> Forget Password?</a>
                </div>
                
                <button type="submit" class="login-button">Login</button>

        </form>
        <p class="login-switch">Don't have an account?
            <a href="signup.html"> Sign Up </a>
        </p>
    </section>
</main>
</body>
</html>
